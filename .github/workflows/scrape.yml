name: Daily apartment scrape

on:
  workflow_dispatch:
  schedule:
    # 15:00 UTC = 7am PST / 8am PDT
    - cron: "0 15 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (fallback browser)
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        # xvfb + headed Chrome passes apartments.com bot checks far more
        # reliably than headless mode.
        run: xvfb-run --auto-servernum npm run scrape
        env:
          HEADFUL: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
